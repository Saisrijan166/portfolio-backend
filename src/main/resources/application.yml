spring:
  application:
    name: portfolio-backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope:
              - openid
              - profile
              - email
            redirect-uri: "{baseUrl}/api/auth/oauth/google/callback"
          github:
            client-id: ${GITHUB_CLIENT_ID:}
            client-secret: ${GITHUB_CLIENT_SECRET:}
            scope:
              - read:user
              - user:email
            redirect-uri: "{baseUrl}/api/auth/oauth/github/callback"
          linkedin:
            client-id: ${LINKEDIN_CLIENT_ID:}
            client-secret: ${LINKEDIN_CLIENT_SECRET:}
            client-name: LinkedIn
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/api/auth/oauth/linkedin/callback"
            scope:
              - openid
              - profile
              - email
            provider: linkedin
        provider:
          linkedin:
            authorization-uri: https://www.linkedin.com/oauth/v2/authorization
            token-uri: https://www.linkedin.com/oauth/v2/accessToken
            user-info-uri: https://api.linkedin.com/v2/userinfo
            user-name-attribute: sub

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:4a2s6f8g0h1j3k5l7m9n1b3v5c7x9z1a2s4d6f8g0h2j4k6l8m0n2b4v6c8x0z2}
  accessExpiration: ${JWT_ACCESS_EXPIRATION:900000}

auth:
  refresh-cookie:
    name: ${AUTH_REFRESH_COOKIE_NAME:refresh_token}
    secure: ${AUTH_REFRESH_COOKIE_SECURE:false}
    same-site: ${AUTH_REFRESH_COOKIE_SAME_SITE:Lax}
    path: ${AUTH_REFRESH_COOKIE_PATH:/}
    max-age-seconds: ${AUTH_REFRESH_COOKIE_MAX_AGE_SECONDS:604800}
  oauth:
    frontend-success-url: ${AUTH_OAUTH_FRONTEND_SUCCESS_URL:http://localhost:3000/auth/callback}
    frontend-failure-url: ${AUTH_OAUTH_FRONTEND_FAILURE_URL:http://localhost:3000/login}
    default-email-domain: ${AUTH_OAUTH_DEFAULT_EMAIL_DOMAIN:oauth.local}
  otp:
    expiry-minutes: ${AUTH_OTP_EXPIRY_MINUTES:5}
    max-attempts: ${AUTH_OTP_MAX_ATTEMPTS:5}
    resend-cooldown-seconds: ${AUTH_OTP_RESEND_COOLDOWN_SECONDS:45}
    mail-from: ${AUTH_OTP_MAIL_FROM:${MAIL_USERNAME:no-reply@portfolio.local}}

feedback:
  hash:
    secret: ${FEEDBACK_HASH_SECRET:${JWT_SECRET:feedback-default-secret}}
  mail:
    from: ${FEEDBACK_MAIL_FROM:${MAIL_USERNAME:no-reply@portfolio.local}}
    developer-email: ${FEEDBACK_DEVELOPER_EMAIL:dev@yourplatform.com}
