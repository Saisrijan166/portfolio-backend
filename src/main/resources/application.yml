spring:
  application:
    name: portfolio-backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:5}
      minimum-idle: ${HIKARI_MIN_IDLE:0}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT:30000}
      max-lifetime: ${HIKARI_MAX_LIFETIME:300000}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:20000}
      keepalive-time: ${HIKARI_KEEPALIVE_TIME:0}
      leak-detection-threshold: ${HIKARI_LEAK_DETECTION:30000}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:none}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 15
        order_inserts: true
        order_updates: true
        generate_statistics: false

  mail:
    host: ${MAIL_HOST:${SMTP_HOST:}}
    port: ${MAIL_PORT:${SMTP_PORT:587}}
    username: ${MAIL_USERNAME:${SMTP_USERNAME:}}
    password: ${MAIL_PASSWORD:${SMTP_PASSWORD:}}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}

  lifecycle:
    timeout-per-shutdown-phase: 30s

mailing:
  from-name: ${MAIL_FROM_NAME:${APP_NAME:Portfoliooss}}
  from-email: ${MAIL_FROM_EMAIL:${MAIL_USERNAME:${SMTP_USERNAME:no-reply@portfoliooss.com}}}
  support-email: ${SUPPORT_EMAIL:${MAIL_FROM_EMAIL:${MAIL_USERNAME:${SMTP_USERNAME:no-reply@portfoliooss.com}}}}
  app-url: ${APP_URL:http://localhost:3000}
  primary-color: ${EMAIL_PRIMARY_COLOR:#111827}
  accent-color: ${EMAIL_ACCENT_COLOR:#f97316}

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework
  tomcat:
    connection-timeout: ${SERVER_CONNECTION_TIMEOUT:20000}
    keep-alive-timeout: ${SERVER_KEEP_ALIVE_TIMEOUT:15000}
    max-connections: ${SERVER_MAX_CONNECTIONS:200}
    threads:
      max: ${SERVER_MAX_THREADS:10}
      min-spare: ${SERVER_MIN_THREADS:2}

jwt:
  secret: ${JWT_SECRET:4a2s6f8g0h1j3k5l7m9n1b3v5c7x9z1a2s4d6f8g0h2j4k6l8m0n2b4v6c8x0z2}
  accessExpiration: ${JWT_ACCESS_EXPIRATION:900000}

auth:
  refresh-cookie:
    name: ${AUTH_REFRESH_COOKIE_NAME:refresh_token}
    secure: ${AUTH_REFRESH_COOKIE_SECURE:true}
    same-site: ${AUTH_REFRESH_COOKIE_SAME_SITE:None}
    path: ${AUTH_REFRESH_COOKIE_PATH:/}
    max-age-seconds: ${AUTH_REFRESH_COOKIE_MAX_AGE_SECONDS:604800}
  oauth:
    frontend-success-url: ${AUTH_OAUTH_FRONTEND_SUCCESS_URL:http://localhost:3000/auth/callback}
    frontend-failure-url: ${AUTH_OAUTH_FRONTEND_FAILURE_URL:http://localhost:3000/login}
    default-email-domain: ${AUTH_OAUTH_DEFAULT_EMAIL_DOMAIN:oauth.local}
  otp:
    expiry-minutes: ${AUTH_OTP_EXPIRY_MINUTES:5}
    max-attempts: ${AUTH_OTP_MAX_ATTEMPTS:5}
    resend-cooldown-seconds: ${AUTH_OTP_RESEND_COOLDOWN_SECONDS:45}
    mail-from: ${AUTH_OTP_MAIL_FROM:${MAIL_FROM_EMAIL:${MAIL_USERNAME:${SMTP_USERNAME:no-reply@portfoliooss.com}}}}

feedback:
  hash:
    secret: ${FEEDBACK_HASH_SECRET:${JWT_SECRET:feedback-default-secret}}
  mail:
    from: ${FEEDBACK_MAIL_FROM:${MAIL_FROM_EMAIL:${MAIL_USERNAME:${SMTP_USERNAME:no-reply@portfoliooss.com}}}}
    developer-email: ${FEEDBACK_DEVELOPER_EMAIL:dev@yourplatform.com}

security:
  trust-proxy-headers: ${SECURITY_TRUST_PROXY_HEADERS:true}
  # Number of reverse proxies in front of the app. The client IP is taken this many hops from the
  # right of X-Forwarded-For; everything to the left of it is caller-supplied and untrusted.
  # Render alone = 1. Add one for each additional trusted proxy (e.g. Cloudflare in front of Render).
  trusted-proxy-count: ${SECURITY_TRUSTED_PROXY_COUNT:1}

  # Requests per client IP per minute. Tune via env without a code change.
  rate-limit:
    global: ${RATE_LIMIT_GLOBAL:600}
    auth-credentials: ${RATE_LIMIT_AUTH_CREDENTIALS:15}
    auth-otp-send: ${RATE_LIMIT_AUTH_OTP_SEND:5}
    auth-otp-verify: ${RATE_LIMIT_AUTH_OTP_VERIFY:10}
    auth-session: ${RATE_LIMIT_AUTH_SESSION:30}
    superadmin-verify: ${RATE_LIMIT_SUPERADMIN_VERIFY:5}
    superadmin-bulk-email: ${RATE_LIMIT_SUPERADMIN_BULK_EMAIL:3}
    superadmin-bulk: ${RATE_LIMIT_SUPERADMIN_BULK:10}
    superadmin: ${RATE_LIMIT_SUPERADMIN:60}
    cron: ${RATE_LIMIT_CRON:12}
    public-contact-message: ${RATE_LIMIT_PUBLIC_CONTACT_MESSAGE:5}
    public-feedback: ${RATE_LIMIT_PUBLIC_FEEDBACK:15}
    public-resume-generate: ${RATE_LIMIT_PUBLIC_RESUME_GENERATE:10}
    public-read: ${RATE_LIMIT_PUBLIC_READ:200}
    admin-feedback: ${RATE_LIMIT_ADMIN_FEEDBACK:40}
    account-username-check: ${RATE_LIMIT_ACCOUNT_USERNAME_CHECK:30}
    account-security: ${RATE_LIMIT_ACCOUNT_SECURITY:10}
    resume-bulk: ${RATE_LIMIT_RESUME_BULK:20}
    resume-job-poll: ${RATE_LIMIT_RESUME_JOB_POLL:120}
    keep-warm: ${RATE_LIMIT_KEEP_WARM:60}
    default: ${RATE_LIMIT_DEFAULT:300}
    ai-per-ip: ${RATE_LIMIT_AI_PER_IP:12}
    ai-per-user: ${RATE_LIMIT_AI_PER_USER:8}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

cron:
  api:
    key: ${CRON_API_KEY}

email:
  batch:
    size: ${EMAIL_BATCH_SIZE:50}
    delay: ${EMAIL_BATCH_DELAY:2000}

brevo:
  api:
    key: ${BREVO_API_KEY:}

superadmin:
  usernames: ${SUPERADMIN_USERNAMES:}
  pin: ${SUPERADMIN_PIN:}
  pin-max-attempts: ${SUPERADMIN_PIN_MAX_ATTEMPTS:5}
  pin-lockout-minutes: ${SUPERADMIN_PIN_LOCKOUT_MINUTES:15}
