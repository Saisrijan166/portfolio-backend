<div>
  <div style="font-size: 24px; font-weight: 700; color: #111827; letter-spacing: -0.03em;">{{TITLE}}</div>
  <p style="margin: 12px 0 0; font-size: 16px; line-height: 1.7; color: #4b5563;">
    Hello <strong>{{USERNAME}}</strong>,
  </p>
  <p style="margin: 12px 0 0; font-size: 16px; line-height: 1.7; color: #4b5563;">
    {{MESSAGE}}
  </p>
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0"
    style="margin: 22px 0 0; border: 1px solid #e5e7eb; border-radius: 18px; background: #f9fafb; padding: 18px;">
    {{DETAILS_ROWS}}
  </table>
  <div
    style="margin-top: 18px; padding: 14px 16px; border-radius: 16px; background: #eff6ff; color: #1d4ed8; font-size: 15px; line-height: 1.7;">
    {{FOOTER_NOTE}}
  </div>
</div>
