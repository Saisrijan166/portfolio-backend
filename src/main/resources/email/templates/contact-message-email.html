<div>
  <div style="font-size: 24px; font-weight: 700; color: #111827; letter-spacing: -0.03em;">{{TITLE}}</div>
  <div style="margin-top: 14px;">
    {{INTRO_HTML}}
  </div>

  <div style="margin-top: 22px; border: 1px solid #e5e7eb; border-radius: 18px; background: #f9fafb; padding: 18px;">
    <div
      style="font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: #6b7280; margin-bottom: 8px;">
      Subject
    </div>
    <div style="font-size: 17px; font-weight: 600; color: #111827; line-height: 1.6;">
      {{CONTACT_SUBJECT}}
    </div>
  </div>

  <div style="margin-top: 16px; border: 1px solid #e5e7eb; border-radius: 18px; background: #ffffff; padding: 18px;">
    <div
      style="font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: #6b7280; margin-bottom: 12px;">
      Message
    </div>
    <div style="font-size: 16px; line-height: 1.6; color: #374151;">
      {{CONTACT_MESSAGE_HTML}}
    </div>
  </div>

  <div
    style="margin-top: 18px; padding: 14px 16px; border-radius: 16px; background: #fff7ed; color: #c2410c; font-size: 15px; line-height: 1.7;">
    Sent from your public contact app for <strong>@{{PORTFOLIO_USERNAME}}</strong>.
  </div>
</div>
