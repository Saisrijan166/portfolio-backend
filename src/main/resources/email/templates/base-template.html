<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{APP_NAME}}</title>
</head>
<body style="margin: 0; padding: 0; background: #f3f4f6; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #111827;">
  <span style="display: none !important; visibility: hidden; opacity: 0; color: transparent; height: 0; width: 0; overflow: hidden;">{{PREHEADER}}</span>
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background: #f3f4f6; padding: 24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width: 640px;">
          <tr>
            <td style="padding: 0 0 16px;">
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background: linear-gradient(135deg, {{PRIMARY_COLOR}}, {{ACCENT_COLOR}}); border-radius: 28px 28px 12px 12px;">
                <tr>
                  <td style="padding: 28px 28px 22px; text-align: left;">
                    {{LOGO_SECTION}}
                    <div style="font-size: 24px; font-weight: 700; color: #ffffff; letter-spacing: -0.03em;">{{APP_NAME}}</div>
                    <div style="margin-top: 8px; font-size: 13px; line-height: 1.6; color: rgba(255,255,255,0.84);">
                      Secure account notifications and authentication updates.
                    </div>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="background: #ffffff; border-radius: 24px; padding: 28px; box-shadow: 0 20px 45px rgba(15, 23, 42, 0.08);">
              {{CONTENT}}
            </td>
          </tr>
          <tr>
            <td style="padding: 18px 8px 0; text-align: center;">
              <div style="font-size: 12px; line-height: 1.7; color: #6b7280;">
                Need help? Contact <a href="mailto:{{SUPPORT_EMAIL}}" style="color: {{PRIMARY_COLOR}}; text-decoration: none;">{{SUPPORT_EMAIL}}</a>
              </div>
              <div style="margin-top: 6px; font-size: 12px; line-height: 1.7; color: #9ca3af;">
                Please do not reply directly to this automated email.
              </div>
              <div style="margin-top: 6px; font-size: 12px; line-height: 1.7; color: #9ca3af;">
                &copy; {{CURRENT_YEAR}} {{APP_NAME}}
              </div>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
