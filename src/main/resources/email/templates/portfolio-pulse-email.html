<div style="background-color: #ffffff; padding: 32px 24px; border-radius: 8px;">
    <!-- Logo placeholder if desired -->
    {{LOGO_SECTION}}

    <h2 style="margin: 0 0 24px; font-size: 22px; font-weight: 600; color: #111827;">{{SUBJECT}}</h2>

    <p style="margin: 0 0 16px; font-size: 18px; color: #374151;">{{GREETING}}</p>

    <div style="margin-bottom: 32px; font-size: 16px; line-height: 1.6; color: #374151;">
        {{MESSAGE_HTML}}
    </div>

    <!-- CTA Button -->
    <table border="0" cellpadding="0" cellspacing="0" style="margin: 0; width: 100%;">
        <tr>
            <td align="center">
                <table border="0" cellpadding="0" cellspacing="0" style="margin: 0 auto;">
                    <tr>
                        <td align="center" style="border-radius: 6px; background-color: {{PRIMARY_COLOR}};">
                            <a href="{{PORTFOLIO_URL}}" target="_blank" rel="noopener noreferrer"
                                style="display: inline-block; padding: 12px 24px; border-radius: 6px; font-size: 16px; font-weight: 500; color: #ffffff; text-decoration: none; background-color: {{PRIMARY_COLOR}}; border: 1px solid {{PRIMARY_COLOR}};">
                                {{CTA_TEXT}} &rarr;
                            </a>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</div>
