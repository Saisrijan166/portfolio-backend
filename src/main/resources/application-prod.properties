# --- DDL: never auto-migrate in production ---
spring.jpa.hibernate.ddl-auto=none

# --- Logging: reduce noise ---
logging.level.root=WARN
logging.level.com.srijan.portfolio=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=WARN

# --- Proxy trust (Render runs behind a reverse proxy) ---
security.trust-proxy-headers=true

# --- Auth: Refresh Token Cookie (SameSite=None for cross-site Vercel -> Render) ---
auth.refresh-cookie.secure=true
auth.refresh-cookie.same-site=None
